<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Multi-Account Hub</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a884">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg-color: #0b141a;
      --card-bg: #111b21;
      --accent-color: #00a884;
      --text-color: #e9edef;
      --muted-text: #8696a0;
      --input-bg: #202c33;
    }

    body.theme-amoled {
      --bg-color: #000000;
      --card-bg: #121212;
      --input-bg: #1e1e1e;
    }

    body.theme-ocean {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --input-bg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      height: fit-content;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 1fr 1fr; }
      .full-width { grid-column: span 2; }
    }

    h2, h3 { color: var(--accent-color); margin-bottom: 10px; }

    .card {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    label { display: block; font-size: 0.85rem; color: var(--muted-text); margin-bottom: 6px; }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-color);
      margin-bottom: 12px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    .btn {
      width: 100%;
      padding: 11px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }

    .flex-row { display: flex; gap: 10px; align-items: center; }

    .contact-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: var(--input-bg);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .contact-item button {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Account & Theme Switcher Header -->
    <div class="full-width card">
      <h2>WhatsApp Multi-Account Hub</h2>
      <div class="flex-row" style="margin-bottom: 10px;">
        <div style="flex: 1;">
          <label for="accountSelect">Active Profile</label>
          <select id="accountSelect" onchange="switchAccount(this.value)">
            <!-- Dynamic Account Options -->
          </select>
        </div>
        <div style="flex: 1;">
          <label for="themeSelect">Theme</label>
          <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="default">WhatsApp Dark</option>
            <option value="theme-amoled">AMOLED Pitch Black</option>
            <option value="theme-ocean">Ocean Blue</option>
          </select>
        </div>
      </div>
      
      <!-- Add Profile Controls -->
      <label>Add New Account Workspace</label>
      <div class="flex-row">
        <input type="text" id="newAccountName" placeholder="Profile Name (e.g., Business)" style="margin-bottom: 0;" />
        <button class="btn" style="width: auto; white-space: nowrap; padding: 10px 16px;" onclick="addAccount()">Add Profile</button>
      </div>
    </div>

    <!-- Direct Messaging Tool -->
    <div class="card">
      <h3>Quick Direct Message</h3>
      <label for="phone">Phone Number (with Country Code)</label>
      <input type="number" id="phone" placeholder="e.g., 919876543210" />

      <label for="message">Preset Message (Optional)</label>
      <textarea id="message" rows="3" placeholder="Type your message here..."></textarea>

      <button class="btn" onclick="openChat()">Send Message</button>
    </div>

    <!-- Account-Specific Quick Contacts -->
    <div class="card">
      <h3>Saved Contacts (<span id="profileBadge">Personal</span>)</h3>
      <input type="text" id="cName" placeholder="Contact Name" />
      <input type="number" id="cNum" placeholder="Phone Number (with Country Code)" />
      <button class="btn" onclick="saveContact()">Save to Profile</button>

      <div id="contactList" style="margin-top: 12px; max-height: 180px; overflow-y: auto;"></div>
    </div>

    <!-- Launch Web Session -->
    <div class="full-width card">
      <h3>Launch WhatsApp Web</h3>
      <p style="color: var(--muted-text); font-size: 0.85rem; margin-bottom: 12px;">
        If opening on a mobile phone, enable <strong>Desktop site</strong> in your browser settings to display the QR code scanner.
      </p>
      <button class="btn" onclick="openWeb('https://web.whatsapp.com')">Open web.whatsapp.com</button>
    </div>
  </div>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registered'))
          .catch((err) => console.log('SW Registration Failed:', err));
      });
    }

    // Local Storage State Management
    let store = JSON.parse(localStorage.getItem('waHubData')) || {
      activeProfile: 'Personal',
      selectedTheme: 'default',
      profiles: {
        'Personal': { contacts: [] },
        'Work': { contacts: [] }
      }
    };

    function saveStore() {
      localStorage.setItem('waHubData', JSON.stringify(store));
    }

    function init() {
      renderAccountDropdown();
      loadActiveProfile();
      if (store.selectedTheme) {
        document.getElementById('themeSelect').value = store.selectedTheme;
        changeTheme(store.selectedTheme);
      }
    }

    function renderAccountDropdown() {
      const select = document.getElementById('accountSelect');
      select.innerHTML = '';
      Object.keys(store.profiles).forEach(prof => {
        const opt = document.createElement('option');
        opt.value = prof;
        opt.textContent = prof;
        if (prof === store.activeProfile) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchAccount(profileName) {
      store.activeProfile = profileName;
      saveStore();
      loadActiveProfile();
    }

    function addAccount() {
      const input = document.getElementById('newAccountName');
      const name = input.value.trim();
      if (!name) return alert('Please enter a profile name');
      if (store.profiles[name]) return alert('Profile already exists');

      store.profiles[name] = { contacts: [] };
      store.activeProfile = name;
      saveStore();
      input.value = '';
      renderAccountDropdown();
      loadActiveProfile();
    }

    function loadActiveProfile() {
      document.getElementById('profileBadge').textContent = store.activeProfile;
      renderContacts();
    }

    function saveContact() {
      const name = document.getElementById('cName').value.trim();
      const num = document.getElementById('cNum').value.trim();
      if (!name || !num) return alert('Please provide both name and phone number');

      store.profiles[store.activeProfile].contacts.push({ name, num });
      saveStore();
      document.getElementById('cName').value = '';
      document.getElementById('cNum').value = '';
      renderContacts();
    }

    function deleteContact(idx) {
      store.profiles[store.activeProfile].contacts.splice(idx, 1);
      saveStore();
      renderContacts();
    }

    function renderContacts() {
      const list = document.getElementById('contactList');
      list.innerHTML = '';
      const contacts = store.profiles[store.activeProfile].contacts;

      if (contacts.length === 0) {
        list.innerHTML = '<p style="color: var(--muted-text); font-size: 0.85rem; text-align: center;">No saved contacts in this profile.</p>';
        return;
      }

      contacts.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'contact-item';
        item.innerHTML = `
          <span><strong>${c.name}</strong> (${c.num})</span>
          <div>
            <button onclick="window.open('https://wa.me/${c.num}', '_blank')">Chat</button>
            <button onclick="deleteContact(${i})" style="color:#ff5555;">Del</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function openChat() {
      const phone = document.getElementById('phone').value.trim();
      const msg = encodeURIComponent(document.getElementById('message').value.trim());
      if (!phone) return alert('Please enter a phone number with country code');
      window.open(`https://wa.me/${phone}${msg ? '?text=' + msg : ''}`, '_blank');
    }

    function openWeb(url) {
      window.open(url, '_blank');
    }

    function changeTheme(theme) {
      document.body.className = theme === 'default' ? '' : theme;
      store.selectedTheme = theme;
      saveStore();
    }

    window.onload = init;
  </script>
</body>
</html>
